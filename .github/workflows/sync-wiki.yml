name: Sync wiki

# Keeps the GitHub wiki in sync with docs/*.md (one wiki page per file).
# docs/ is the source of truth: edits made directly on the wiki will be
# overwritten by the next sync.

on:
  push:
    branches: [ develop ]
    paths: [ 'docs/**', scripts/sync-wiki.sh ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Clone wiki
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Render wiki pages from docs/
        run: bash scripts/sync-wiki.sh docs wiki

      - name: Commit and push if changed
        run: |
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898084+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync wiki from docs/ (${{ github.sha }})"
          git push
