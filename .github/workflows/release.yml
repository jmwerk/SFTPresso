name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.16.6)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package --out sftpresso-${{ steps.tag.outputs.tag }}.vsix

      # A semver pre-release tag (v1.40.0-pre.1) comes from develop; GitHub never marks
      # a pre-release as "Latest", so that keeps pointing at the stable build.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: sftpresso-${{ steps.tag.outputs.tag }}.vsix
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
