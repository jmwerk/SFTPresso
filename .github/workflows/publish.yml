name: Publish

# Publishes the extension to the VS Code Marketplace and Open VSX on a
# stable version tag (released from main). Runs in parallel with release.yml
# (which builds the GitHub Release); this job handles the two marketplaces.
#
# Requires two repository secrets:
#   - VSCE_PAT : Azure DevOps PAT for the `jmwerk` Marketplace publisher
#   - OVSX_PAT : Open VSX access token for the `jmwerk` namespace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.20.2)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # The Marketplace rejects semver pre-release versions; those ship as GitHub pre-releases only
      - name: Refuse pre-release tags
        if: contains(steps.tag.outputs.tag, '-')
        run: |
          echo "::error::${{ steps.tag.outputs.tag }} is a pre-release; publish stable tags from main only"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package extension
        run: npx @vscode/vsce package --out sftpresso-${{ steps.tag.outputs.tag }}.vsix

      # Publish the exact same .vsix to both registries so the artifacts match.
      # --skip-duplicate lets a re-run finish a half-done publish instead of failing on step one.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath sftpresso-${{ steps.tag.outputs.tag }}.vsix --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish sftpresso-${{ steps.tag.outputs.tag }}.vsix -p "$OVSX_PAT" --skip-duplicate
