name: Deploy site

# Publishes the landing page under site/ to GitHub Pages at
# https://jmwerk.github.io/SFTPresso/. The first run enables Pages
# with "GitHub Actions" as the source; later runs just redeploy.

on:
  push:
    branches: [ develop ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site (source: GitHub Actions) on first run,
          # so no manual step is needed under Settings → Pages.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
