# FTP and SSH servers used only by the integration suite
# (test/integration/*.spec.ts). Every image is multi-arch (amd64 + arm64) so the
# stack runs the same on CI (ubuntu/amd64) and on Apple Silicon. Credentials,
# certs, and keys here are throwaway and must never be reused outside these
# tests.
#
#   npm run test:integration:up     # generates the ssh test key, then up -d --wait
#   npm run test:integration
#   npm run test:integration:down
#
# See CONTRIBUTING.md for the full workflow.

services:
  # Plain FTP, no MLSD -> exercises the legacy LIST parsing / rawModifiedAt path.
  # Not chrooted: the test user logs in at /ftp/testuser.
  vsftpd:
    image: delfer/alpine-ftp-server:latest
    environment:
      USERS: "testuser|testpass|/ftp/testuser"
    # The image's start_vsftpd.sh launches vsftpd with the config's
    # `background=YES`, so it forks and returns immediately, then does:
    #
    #   pgrep vsftpd | tail -n 1 > /var/run/vsftpd/vsftpd.pid
    #   exec pidproxy /var/run/vsftpd/vsftpd.pid true
    #
    # When the fork has not landed by the time pgrep runs, the pidfile is empty,
    # pidproxy has no process to watch and exits 0 straight away -- the container
    # stops before it ever goes healthy and `up --wait` fails the whole job. It
    # is timing-dependent, so a loaded CI runner hits it and a laptop usually
    # does not.
    #
    # Passing an explicit command takes the script's `exec "$@"` branch instead,
    # which skips pgrep and pidproxy entirely; -obackground=NO then keeps vsftpd
    # in the foreground as PID 1's child. The user setup above still runs first.
    # The passive/address options move here because the MIN_PORT / MAX_PORT /
    # ADDRESS env vars are only read by the branch we no longer take.
    #
    # The config path goes *first*: vsftpd applies settings in argument order, so
    # with the file last its `background=YES` overrides -obackground=NO and the
    # container exits immediately -- the very failure this is meant to remove.
    command:
      - vsftpd
      - /etc/vsftpd/vsftpd.conf
      - -obackground=NO
      - -opasv_min_port=21000
      - -opasv_max_port=21010
      - -opasv_address=127.0.0.1
    ports:
      - "2121:21"
      - "21000-21010:21000-21010"
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ltn | grep -q ':21 '"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Explicit FTPS (AUTH TLS) with MLSD -> exercises the TLS control channel,
  # clear-text data for secure:"control", and second-precision UTC timestamps.
  # Virtual user is chrooted, logging in at /.
  pure-ftpd:
    image: crazymax/pure-ftpd:latest
    environment:
      # SECURE_MODE=false drops --norename and the dotfile prohibitions so the
      # rename / recursive-delete tests work.
      SECURE_MODE: "false"
      PASSIVE_IP: "127.0.0.1"
      PASSIVE_PORT_RANGE: "30000:30009"
      FTP_USER: "testuser"
      FTP_PASSWORD: "testpass"
    ports:
      - "2101:2100"
      - "30000-30009:30000-30009"
    volumes:
      # Runs before the image's own 01-config.sh: generates the self-signed
      # cert, enables --tls 1, and creates the virtual user.
      - ./pure-ftpd/00-setup.sh:/etc/cont-init.d/00-setup.sh
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ltn | grep -q ':2100 '"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # OpenSSH -> exercises the ssh2/SFTP client: password and key auth, the mode
  # cascade (filePerm / perserveTargetMode / fallbackMode), futimes mtime
  # preservation, symlinks, and the posix-rename extension behind
  # `useTempFile` + `openSsh`. Built locally (see ./openssh/Dockerfile) so the
  # sftp subsystem and the test user's permissions are pinned.
  openssh:
    build:
      context: ./openssh
    environment:
      SSH_USER: "testuser"
      SSH_PASSWORD: "testpass"
    ports:
      - "2222:2222"
    volumes:
      # Public half of the keypair generated by ./openssh/prepare-keys.sh; the
      # entrypoint installs it as the test user's authorized_keys.
      - ./openssh/keys:/pubkey:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ltn | grep -q ':2222 '"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
